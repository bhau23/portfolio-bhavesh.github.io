<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b69"/>
      <stop offset="100%" style="stop-color:#4a1f8e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Neural network nodes -->
  <g opacity="0.15">
    <circle cx="200" cy="150" r="20" stroke="#fff" fill="none" stroke-width="1"/>
    <circle cx="200" cy="250" r="20" stroke="#fff" fill="none" stroke-width="1"/>
    <circle cx="200" cy="350" r="20" stroke="#fff" fill="none" stroke-width="1"/>
    <circle cx="400" cy="180" r="20" stroke="#fff" fill="none" stroke-width="1"/>
    <circle cx="400" cy="300" r="20" stroke="#fff" fill="none" stroke-width="1"/>
    <circle cx="600" cy="240" r="20" stroke="#fff" fill="none" stroke-width="1"/>
    <line x1="220" y1="150" x2="380" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="220" y1="150" x2="380" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="220" y1="250" x2="380" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="220" y1="250" x2="380" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="220" y1="350" x2="380" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="220" y1="350" x2="380" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="420" y1="180" x2="580" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="420" y1="300" x2="580" y2="240" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Detection box -->
  <g transform="translate(400,230)">
    <rect x="-100" y="-90" width="200" height="180" rx="10" fill="none" stroke="#00e676" stroke-width="3" opacity="0.8"/>
    <rect x="-95" y="-85" width="190" height="170" rx="8" fill="none" stroke="#00e676" stroke-width="1" opacity="0.3" stroke-dasharray="5,3"/>
    <!-- Object silhouette -->
    <rect x="-60" y="-60" width="120" height="90" rx="8" fill="#00e676" opacity="0.15"/>
    <text x="0" y="-20" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="14" font-weight="bold">DETECTED</text>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" opacity="0.7">MobileNet + PASCAL VOC</text>
    <!-- Confidence bar -->
    <rect x="-50" y="30" width="100" height="6" rx="3" fill="#fff" opacity="0.2"/>
    <rect x="-50" y="30" width="85" height="6" rx="3" fill="#00e676" opacity="0.8"/>
    <text x="55" y="37" fill="#00e676" font-family="Arial, sans-serif" font-size="10">95%</text>
    <!-- Corner markers -->
    <line x1="-100" y1="-75" x2="-100" y2="-90" stroke="#00e676" stroke-width="3"/>
    <line x1="-100" y1="-90" x2="-85" y2="-90" stroke="#00e676" stroke-width="3"/>
    <line x1="100" y1="-75" x2="100" y2="-90" stroke="#00e676" stroke-width="3"/>
    <line x1="100" y1="-90" x2="85" y2="-90" stroke="#00e676" stroke-width="3"/>
    <line x1="-100" y1="75" x2="-100" y2="90" stroke="#00e676" stroke-width="3"/>
    <line x1="-100" y1="90" x2="-85" y2="90" stroke="#00e676" stroke-width="3"/>
    <line x1="100" y1="75" x2="100" y2="90" stroke="#00e676" stroke-width="3"/>
    <line x1="100" y1="90" x2="85" y2="90" stroke="#00e676" stroke-width="3"/>
  </g>
  <!-- Title -->
  <text x="400" y="410" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Object Detection</text>
  <text x="400" y="450" text-anchor="middle" fill="#ababab" font-family="Arial, sans-serif" font-size="18">MobileNet on PASCAL VOC 2012</text>
  <!-- Tech badges -->
  <rect x="260" y="475" width="100" height="28" rx="14" fill="#00e676" opacity="0.2"/>
  <text x="310" y="494" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="12" font-weight="bold">MobileNet</text>
  <rect x="375" y="475" width="120" height="28" rx="14" fill="#00e676" opacity="0.2"/>
  <text x="435" y="494" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PASCAL VOC</text>
</svg>