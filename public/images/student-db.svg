<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1821"/>
      <stop offset="50%" style="stop-color:#1b2838"/>
      <stop offset="100%" style="stop-color:#2b3e50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Database icon -->
  <g transform="translate(400,200)">
    <!-- Database cylinders -->
    <ellipse cx="0" cy="-60" rx="80" ry="25" fill="none" stroke="#4fc3f7" stroke-width="2.5" opacity="0.9"/>
    <line x1="-80" y1="-60" x2="-80" y2="0" stroke="#4fc3f7" stroke-width="2.5" opacity="0.7"/>
    <line x1="80" y1="-60" x2="80" y2="0" stroke="#4fc3f7" stroke-width="2.5" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="80" ry="25" fill="none" stroke="#4fc3f7" stroke-width="2.5" opacity="0.7"/>
    <line x1="-80" y1="0" x2="-80" y2="60" stroke="#4fc3f7" stroke-width="2.5" opacity="0.5"/>
    <line x1="80" y1="0" x2="80" y2="60" stroke="#4fc3f7" stroke-width="2.5" opacity="0.5"/>
    <ellipse cx="0" cy="60" rx="80" ry="25" fill="none" stroke="#4fc3f7" stroke-width="2.5" opacity="0.5"/>
    <!-- Fill -->
    <ellipse cx="0" cy="-60" rx="75" ry="22" fill="#4fc3f7" opacity="0.08"/>
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#4fc3f7" opacity="0.06"/>
    <ellipse cx="0" cy="60" rx="75" ry="22" fill="#4fc3f7" opacity="0.04"/>
    <!-- Data lines inside -->
    <line x1="-50" y1="-55" x2="50" y2="-55" stroke="#4fc3f7" stroke-width="1" opacity="0.3"/>
    <line x1="-40" y1="-48" x2="40" y2="-48" stroke="#4fc3f7" stroke-width="1" opacity="0.3"/>
    <line x1="-50" y1="5" x2="50" y2="5" stroke="#4fc3f7" stroke-width="1" opacity="0.3"/>
    <line x1="-40" y1="12" x2="40" y2="12" stroke="#4fc3f7" stroke-width="1" opacity="0.3"/>
    <!-- Student icon -->
    <g transform="translate(120,-30)">
      <circle cx="0" cy="-15" r="12" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
      <path d="M -18,15 Q 0,-5 18,15" stroke="#ff6b6b" fill="none" stroke-width="2" opacity="0.7"/>
      <!-- Graduation cap -->
      <polygon points="0,-30 -18,-22 0,-14 18,-22" fill="#ff6b6b" opacity="0.6"/>
      <line x1="0" y1="-30" x2="0" y2="-35" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>
    </g>
    <!-- AI sparkle -->
    <g transform="translate(-120,-20)" opacity="0.5">
      <path d="M 0,-12 L 2,-2 L 12,0 L 2,2 L 0,12 L -2,2 L -12,0 L -2,-2 Z" fill="#4fc3f7"/>
    </g>
  </g>
  <!-- Title -->
  <text x="400" y="400" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="bold">Student DB Management</text>
  <text x="400" y="440" text-anchor="middle" fill="#ababab" font-family="Arial, sans-serif" font-size="18">AI-Powered Database System</text>
  <!-- Tech badges -->
  <rect x="280" y="465" width="50" height="28" rx="14" fill="#4fc3f7" opacity="0.3"/>
  <text x="305" y="484" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">AI</text>
  <rect x="345" y="465" width="70" height="28" rx="14" fill="#ff6b6b" opacity="0.3"/>
  <text x="380" y="484" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SQL</text>
  <rect x="430" y="465" width="110" height="28" rx="14" fill="#4fc3f7" opacity="0.3"/>
  <text x="485" y="484" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Database</text>
</svg>