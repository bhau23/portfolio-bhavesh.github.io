<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#21262d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Robot face -->
  <g transform="translate(400,210)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#39d353" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="75" fill="#39d353" opacity="0.08"/>
    <!-- Eyes -->
    <circle cx="-25" cy="-15" r="12" fill="#39d353" opacity="0.9"/>
    <circle cx="25" cy="-15" r="12" fill="#39d353" opacity="0.9"/>
    <circle cx="-25" cy="-15" r="6" fill="#0d1117"/>
    <circle cx="25" cy="-15" r="6" fill="#0d1117"/>
    <!-- Smile -->
    <path d="M -30,20 Q 0,45 30,20" stroke="#39d353" fill="none" stroke-width="3" stroke-linecap="round"/>
    <!-- Chat indicators -->
    <rect x="-110" y="-30" width="15" height="3" rx="1.5" fill="#39d353" opacity="0.5"/>
    <rect x="-115" y="-20" width="20" height="3" rx="1.5" fill="#39d353" opacity="0.4"/>
    <rect x="-108" y="-10" width="12" height="3" rx="1.5" fill="#39d353" opacity="0.3"/>
    <rect x="95" y="-30" width="15" height="3" rx="1.5" fill="#39d353" opacity="0.5"/>
    <rect x="98" y="-20" width="20" height="3" rx="1.5" fill="#39d353" opacity="0.4"/>
    <rect x="100" y="-10" width="12" height="3" rx="1.5" fill="#39d353" opacity="0.3"/>
    <!-- Code symbols -->
    <text x="-120" y="60" fill="#39d353" font-family="monospace" font-size="18" opacity="0.3">&lt;/&gt;</text>
    <text x="100" y="60" fill="#39d353" font-family="monospace" font-size="18" opacity="0.3">{...}</text>
  </g>
  <!-- Title -->
  <text x="400" y="400" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Python Chatbot</text>
  <text x="400" y="440" text-anchor="middle" fill="#ababab" font-family="Arial, sans-serif" font-size="18">Intelligent Conversational AI</text>
  <!-- Tech badges -->
  <rect x="310" y="465" width="80" height="28" rx="14" fill="#39d353" opacity="0.3"/>
  <text x="350" y="484" text-anchor="middle" fill="#39d353" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Python</text>
  <rect x="405" y="465" width="60" height="28" rx="14" fill="#39d353" opacity="0.3"/>
  <text x="435" y="484" text-anchor="middle" fill="#39d353" font-family="Arial, sans-serif" font-size="12" font-weight="bold">NLP</text>
</svg>