<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="50%" style="stop-color:#1b263b"/>
      <stop offset="100%" style="stop-color:#415a77"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#f4a261"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- World map dots pattern -->
  <g opacity="0.12">
    <circle cx="150" cy="150" r="3" fill="#fff"/>
    <circle cx="200" cy="120" r="3" fill="#fff"/>
    <circle cx="250" cy="180" r="3" fill="#fff"/>
    <circle cx="350" cy="140" r="3" fill="#fff"/>
    <circle cx="450" cy="160" r="3" fill="#fff"/>
    <circle cx="550" cy="130" r="3" fill="#fff"/>
    <circle cx="650" cy="170" r="3" fill="#fff"/>
    <circle cx="300" cy="200" r="3" fill="#fff"/>
    <circle cx="500" cy="190" r="3" fill="#fff"/>
    <circle cx="600" cy="210" r="3" fill="#fff"/>
    <circle cx="180" cy="250" r="3" fill="#fff"/>
    <circle cx="400" cy="100" r="3" fill="#fff"/>
  </g>
  <!-- Plane icon -->
  <g transform="translate(400,200)">
    <path d="M -10,-60 L 10,-60 L 50,0 L 10,10 L 10,40 L 20,55 L -20,55 L -10,40 L -10,10 L -50,0 Z" fill="url(#accent)" opacity="0.9" transform="rotate(-30)"/>
    <!-- Route line -->
    <path d="M -150,80 Q -50,20 0,0 Q 50,-20 150,80" stroke="#f4a261" fill="none" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
    <!-- Location pins -->
    <g transform="translate(-140,85)">
      <circle cx="0" cy="-8" r="8" fill="#e63946"/>
      <path d="M -8,-8 Q 0,10 8,-8" fill="#e63946"/>
    </g>
    <g transform="translate(140,85)">
      <circle cx="0" cy="-8" r="8" fill="#f4a261"/>
      <path d="M -8,-8 Q 0,10 8,-8" fill="#f4a261"/>
    </g>
  </g>
  <!-- Gemini sparkle -->
  <g transform="translate(560,160)" opacity="0.7">
    <path d="M 0,-15 L 3,-3 L 15,0 L 3,3 L 0,15 L -3,3 L -15,0 L -3,-3 Z" fill="#f4a261"/>
  </g>
  <g transform="translate(240,130)" opacity="0.5">
    <path d="M 0,-10 L 2,-2 L 10,0 L 2,2 L 0,10 L -2,2 L -10,0 L -2,-2 Z" fill="#e63946"/>
  </g>
  <!-- Title -->
  <text x="400" y="400" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="bold">AI Travel Planner</text>
  <text x="400" y="440" text-anchor="middle" fill="#ababab" font-family="Arial, sans-serif" font-size="18">Gemini AI Powered Itineraries</text>
  <!-- Tech badges -->
  <rect x="240" y="465" width="90" height="28" rx="14" fill="#e63946" opacity="0.3"/>
  <text x="285" y="484" text-anchor="middle" fill="#e63946" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Streamlit</text>
  <rect x="345" y="465" width="100" height="28" rx="14" fill="#f4a261" opacity="0.3"/>
  <text x="395" y="484" text-anchor="middle" fill="#f4a261" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Gemini AI</text>
  <rect x="460" y="465" width="80" height="28" rx="14" fill="#e63946" opacity="0.3"/>
  <text x="500" y="484" text-anchor="middle" fill="#e63946" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Python</text>
</svg>