<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a192f"/>
      <stop offset="50%" style="stop-color:#112240"/>
      <stop offset="100%" style="stop-color:#1d3557"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Chat bubbles -->
  <g transform="translate(400,220)">
    <!-- Left bubble -->
    <rect x="-160" y="-100" width="180" height="60" rx="20" fill="#1890ff" opacity="0.9"/>
    <text x="-70" y="-65" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14">Hello! How can I help?</text>
    <polygon points="-140,-40 -150,-40 -160,-55" fill="#1890ff" opacity="0.9"/>
    <!-- Right bubble -->
    <rect x="-20" y="-30" width="180" height="60" rx="20" fill="#333" opacity="0.9"/>
    <text x="70" y="5" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14">Analyze this data...</text>
    <polygon points="140,30 150,30 160,15" fill="#333" opacity="0.9"/>
    <!-- Left bubble 2 -->
    <rect x="-160" y="40" width="200" height="60" rx="20" fill="#1890ff" opacity="0.9"/>
    <text x="-60" y="75" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14">Processing your request...</text>
    <polygon points="-140,100 -150,100 -160,85" fill="#1890ff" opacity="0.9"/>
    <!-- Typing indicator -->
    <g transform="translate(-140, 115)">
      <circle cx="0" cy="0" r="4" fill="#1890ff" opacity="0.5"/>
      <circle cx="15" cy="0" r="4" fill="#1890ff" opacity="0.7"/>
      <circle cx="30" cy="0" r="4" fill="#1890ff" opacity="0.9"/>
    </g>
  </g>
  <!-- AI sparkles -->
  <g transform="translate(580,140)" opacity="0.6">
    <path d="M 0,-12 L 2,-2 L 12,0 L 2,2 L 0,12 L -2,2 L -12,0 L -2,-2 Z" fill="#1890ff"/>
  </g>
  <g transform="translate(220,310)" opacity="0.4">
    <path d="M 0,-8 L 1.5,-1.5 L 8,0 L 1.5,1.5 L 0,8 L -1.5,1.5 L -8,0 L -1.5,-1.5 Z" fill="#1890ff"/>
  </g>
  <!-- Title -->
  <text x="400" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="bold">BeyondChats</text>
  <text x="400" y="460" text-anchor="middle" fill="#ababab" font-family="Arial, sans-serif" font-size="18">AI-Powered Chat Analytics</text>
  <!-- Tech badges -->
  <rect x="310" y="485" width="80" height="28" rx="14" fill="#1890ff" opacity="0.3"/>
  <text x="350" y="504" text-anchor="middle" fill="#1890ff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Python</text>
  <rect x="405" y="485" width="50" height="28" rx="14" fill="#1890ff" opacity="0.3"/>
  <text x="430" y="504" text-anchor="middle" fill="#1890ff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">AI</text>
</svg>