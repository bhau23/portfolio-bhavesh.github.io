<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="0" y2="600" stroke="#fff" stroke-width="1" transform="translate(100,0)"/>
    <line x1="0" y1="0" x2="0" y2="600" stroke="#fff" stroke-width="1" transform="translate(200,0)"/>
    <line x1="0" y1="0" x2="0" y2="600" stroke="#fff" stroke-width="1" transform="translate(300,0)"/>
    <line x1="0" y1="0" x2="0" y2="600" stroke="#fff" stroke-width="1" transform="translate(400,0)"/>
    <line x1="0" y1="0" x2="0" y2="600" stroke="#fff" stroke-width="1" transform="translate(500,0)"/>
    <line x1="0" y1="0" x2="0" y2="600" stroke="#fff" stroke-width="1" transform="translate(600,0)"/>
    <line x1="0" y1="0" x2="0" y2="600" stroke="#fff" stroke-width="1" transform="translate(700,0)"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,100)"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,200)"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,300)"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,400)"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,500)"/>
  </g>
  <!-- Robot/Agent icon -->
  <g transform="translate(400,240)">
    <rect x="-70" y="-80" width="140" height="120" rx="20" fill="url(#accent)" opacity="0.9"/>
    <circle cx="-25" cy="-30" r="15" fill="#fff"/>
    <circle cx="25" cy="-30" r="15" fill="#fff"/>
    <circle cx="-25" cy="-30" r="8" fill="#1a1a2e"/>
    <circle cx="25" cy="-30" r="8" fill="#1a1a2e"/>
    <rect x="-30" y="10" width="60" height="8" rx="4" fill="#fff" opacity="0.9"/>
    <!-- Antenna -->
    <line x1="0" y1="-80" x2="0" y2="-110" stroke="#fff" stroke-width="4"/>
    <circle cx="0" cy="-115" r="8" fill="#e94560"/>
    <!-- Signal waves -->
    <path d="M -20,-100 Q -30,-120 -15,-130" stroke="#e94560" fill="none" stroke-width="3" opacity="0.6"/>
    <path d="M 20,-100 Q 30,-120 15,-130" stroke="#e94560" fill="none" stroke-width="3" opacity="0.6"/>
    <!-- Stream lines -->
    <line x1="-100" y1="-20" x2="-80" y2="-20" stroke="#e94560" stroke-width="3" opacity="0.5"/>
    <line x1="-110" y1="0" x2="-80" y2="0" stroke="#ff6b6b" stroke-width="3" opacity="0.4"/>
    <line x1="-100" y1="20" x2="-80" y2="20" stroke="#e94560" stroke-width="3" opacity="0.5"/>
    <line x1="80" y1="-20" x2="100" y2="-20" stroke="#e94560" stroke-width="3" opacity="0.5"/>
    <line x1="80" y1="0" x2="110" y2="0" stroke="#ff6b6b" stroke-width="3" opacity="0.4"/>
    <line x1="80" y1="20" x2="100" y2="20" stroke="#e94560" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- Title -->
  <text x="400" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="bold">AutoStream Agent</text>
  <text x="400" y="460" text-anchor="middle" fill="#ababab" font-family="Arial, sans-serif" font-size="18">AI-Powered Automation Agent</text>
  <!-- Tech badges -->
  <rect x="300" y="485" width="80" height="28" rx="14" fill="#e94560" opacity="0.3"/>
  <text x="340" y="504" text-anchor="middle" fill="#e94560" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Python</text>
  <rect x="395" y="485" width="50" height="28" rx="14" fill="#e94560" opacity="0.3"/>
  <text x="420" y="504" text-anchor="middle" fill="#e94560" font-family="Arial, sans-serif" font-size="12" font-weight="bold">AI</text>
</svg>