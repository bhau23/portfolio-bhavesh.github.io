  <rect x="250" y="430" width="300" height="56" rx="28" fill="none" stroke="url(#ac)" stroke-width="2"/>
  <text x="400" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">GESTURE CONTROL</text>
  <text x="400" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#9aa0a6" text-anchor="middle">OpenCV · MediaPipe · Real-time Hand Tracking</text>
