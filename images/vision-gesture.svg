      <stop offset="0" stop-color="#0d0d14"/>
      <stop offset="1" stop-color="#1a0a12"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff004f"/>
      <stop offset="1" stop-color="#ff7a45"/>
